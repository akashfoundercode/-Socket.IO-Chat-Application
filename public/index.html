<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wavenet Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --ink: #12232b;
      --muted: #71808a;
      --line: #e5ebed;
      --teal: #0a8f83;
      --teal-dark: #076b63;
      --mint: #dff7ed;
      --paper: #f7faf9;
      --bubble: #d9f9e7;
      --shadow: 0 24px 70px rgba(26, 48, 50, .14)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: #dcebe7;
      color: var(--ink);
      font-family: 'DM Sans', sans-serif
    }

    button,
    input {
      font: inherit
    }

    button {
      cursor: pointer;
      border: 0
    }

    .app {
      min-height: 100vh;
      padding: 32px;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 10% 10%, #c5e9e0 0 18%, transparent 38%), linear-gradient(135deg, #e8f3ef, #d4e8e5)
    }

    .shell {
      width: min(1240px, 100%);
      height: min(860px, calc(100vh - 64px));
      min-height: 620px;
      display: grid;
      grid-template-columns: 340px 1fr;
      overflow: hidden;
      border-radius: 24px;
      background: #fff;
      box-shadow: var(--shadow)
    }

    .sidebar {
      background: #fff;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column
    }

    .brand {
      padding: 24px 24px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .brand h1 {
      font: 800 23px Manrope;
      margin: 0;
      letter-spacing: -.7px
    }

    .brand h1 span {
      color: var(--teal)
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      background: transparent;
      color: #71808a;
      border-radius: 50%;
      font-size: 16px
    }

    .icon-btn:hover {
      background: #edf7f4;
      color: var(--teal)
    }

    .profile-card {
      margin: 0 16px 16px;
      padding: 14px;
      background: linear-gradient(120deg, #0a8f83, #36b296);
      border-radius: 16px;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      display: grid;
      place-items: center;
      background: #d8eee7;
      color: #08776e;
      font-weight: 700;
      flex: none
    }

    .profile-card .avatar {
      background: #bde8d9;
      color: #08776e
    }

    .profile-card strong {
      display: block;
      font-size: 14px
    }

    .profile-card small {
      opacity: .8
    }

    .search {
      margin: 0 16px 14px;
      background: #f2f6f5;
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      color: #8c9a9f
    }

    .search input {
      border: 0;
      background: transparent;
      outline: 0;
      padding: 11px 9px;
      width: 100%;
      font-size: 13px
    }

    .section-label {
      padding: 0 20px 8px;
      color: #8b989d;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase
    }

    .contacts {
      overflow: auto
    }

    .contact {
      width: 100%;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      background: #fff;
      border-left: 3px solid transparent
    }

    .contact:hover,
    .contact.active {
      background: #eff9f5;
      border-left-color: var(--teal)
    }

    .contact .avatar {
      width: 46px;
      height: 46px
    }

    .contact-info {
      min-width: 0;
      flex: 1
    }

    .contact-top {
      display: flex;
      justify-content: space-between;
      gap: 8px
    }

    .contact strong {
      font-size: 14px
    }

    .contact time {
      font-size: 11px;
      color: #9aa5a9;
      white-space: nowrap
    }

    .preview {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #87949a;
      font-size: 12px;
      margin-top: 3px
    }

    .chat {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #f5f8f7
    }

    .chat-header {
      height: 78px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 25px;
      gap: 13px
    }

    .chat-header .avatar {
      width: 43px;
      height: 43px
    }

    .chat-person {
      flex: 1
    }

    .chat-person strong {
      font: 700 15px Manrope
    }

    .chat-person small {
      display: block;
      color: #32a385;
      font-size: 12px;
      margin-top: 3px
    }

    .header-actions {
      display: flex;
      gap: 4px
    }

    .messages {
      flex: 1;
      overflow: auto;
      padding: 30px 7%;
      background-color: #eef5f2;
      background-image: radial-gradient(#d7e7e2 1px, transparent 1px);
      background-size: 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 9px
    }

    .date-chip {
      align-self: center;
      padding: 6px 13px;
      border-radius: 8px;
      background: #d8e8e4;
      color: #6d8783;
      text-transform: uppercase;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 12px
    }

    .message {
      max-width: min(70%, 560px);
      padding: 11px 13px 7px;
      border-radius: 13px;
      background: white;
      box-shadow: 0 2px 5px #164b3810;
      align-self: flex-start;
      position: relative
    }

    .message.sent {
      align-self: flex-end;
      background: var(--bubble);
      border-bottom-right-radius: 3px
    }

    .message.received {
      border-bottom-left-radius: 3px
    }

    .message.deleted {
      color: #95a3a0;
      font-style: italic
    }

    .message p {
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap
    }

    .message img {
      max-width: 280px;
      border-radius: 9px;
      display: block;
      margin-bottom: 5px
    }

    .meta {
      display: block;
      text-align: right;
      color: #849891;
      font-size: 10px;
      margin-top: 4px
    }

    .sent .meta i {
      color: #0aa485;
      margin-left: 3px
    }

    .message-menu {
      display: none;
      position: absolute;
      right: 8px;
      top: 32px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 24px #23483b20;
      z-index: 4;
      overflow: hidden
    }

    .message:hover .message-menu {
      display: block
    }

    .message-menu button {
      display: block;
      padding: 8px 13px;
      background: #fff;
      color: #536b67;
      font-size: 11px;
      white-space: nowrap
    }

    .message-menu button:hover {
      background: #eef8f4
    }

    .typing {
      height: 20px;
      padding-left: 7%;
      color: #78908b;
      font-size: 11px;
      font-style: italic
    }

    .composer-wrap {
      padding: 13px 25px 18px;
      background: #fff;
      border-top: 1px solid var(--line);
      position: relative
    }

    .upload-preview {
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f7fbfa;
    }

    .upload-preview.open {
      display: flex
    }

    .upload-preview img {
      width: 54px;
      height: 54px;
      border-radius: 8px;
      object-fit: cover
    }

    .upload-preview span {
      flex: 1;
      color: #607772;
      font-size: 12px
    }

    .upload-preview button {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e8f3ef;
      color: #62827b
    }

    .upload-preview button:hover {
      background: #d8ebe5;
      color: var(--teal)
    }

    .composer {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #f2f6f5;
      border-radius: 14px;
      padding: 5px 7px 5px 14px
    }

    .composer input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      padding: 10px 4px;
      font-size: 14px
    }

    .send {
      background: var(--teal);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 12px
    }

    .send:hover {
      background: var(--teal-dark)
    }

    .emoji-panel {
      display: none;
      position: absolute;
      bottom: 72px;
      left: 18px;
      background: #fff;
      border: 1px solid var(--line);
      padding: 10px;
      border-radius: 14px;
      box-shadow: 0 10px 30px #23483b20;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px
    }

    .emoji-panel.open {
      display: grid
    }

    .emoji-panel button {
      background: white;
      font-size: 20px;
      padding: 4px
    }

    .file-input {
      display: none
    }

    .empty {
      margin: auto;
      text-align: center;
      color: #78908b
    }

    .empty i {
      font-size: 46px;
      color: #9acdc0;
      margin-bottom: 15px
    }

    .empty h2 {
      font: 800 24px Manrope;
      margin: 0 0 7px
    }

    .empty p {
      font-size: 13px;
      margin: 0
    }

    .modal {
      position: fixed;
      inset: 0;
      background: #122b2a66;
      display: none;
      place-items: center;
      padding: 18px;
      z-index: 10
    }

    .modal.open {
      display: grid
    }

    .modal-card {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 20px;
      padding: 26px;
      box-shadow: var(--shadow)
    }

    .modal-card h2 {
      font: 800 23px Manrope;
      margin: 0 0 18px
    }

    .auth-tabs {
      display: flex;
      background: #eff6f4;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px
    }

    .auth-tabs button {
      width: 50%;
      padding: 9px;
      border-radius: 8px;
      background: transparent;
      color: #78908b
    }

    .auth-tabs button.active {
      background: #fff;
      color: var(--teal);
      box-shadow: 0 2px 8px #23483b12
    }

    .field {
      display: block;
      margin: 12px 0
    }

    .field span {
      display: block;
      color: #617872;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px
    }

    .field input {
      width: 100%;
      border: 1px solid #dce9e5;
      border-radius: 9px;
      padding: 11px;
      outline-color: var(--teal)
    }

    .primary {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      background: var(--teal);
      color: white;
      border-radius: 10px;
      font-weight: 700
    }

    .auth-error {
      color: #d15d54;
      font-size: 12px;
      margin: 10px 0;
      min-height: 15px
    }

    .drawer {
      position: fixed;
      right: 0;
      top: 0;
      height: 100%;
      width: min(360px, 100%);
      background: #fff;
      z-index: 8;
      transform: translateX(100%);
      transition: transform .25s ease;
      box-shadow: -10px 0 40px #23483b18;
      padding: 22px
    }

    .drawer.open {
      transform: none
    }

    .drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .drawer h2 {
      font: 800 20px Manrope
    }

    .big-avatar {
      width: 86px;
      height: 86px;
      margin: 28px auto 12px
    }

    .drawer .field input {
      background: #f5f8f7
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #173934;
      color: #fff;
      padding: 11px 16px;
      border-radius: 9px;
      font-size: 12px;
      opacity: 0;
      transition: .2s;
      z-index: 20
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%)
    }

    .mobile-only {
      display: none
    }

    @media(max-width:760px) {
      .app {
        padding: 0
      }

      .shell {
        height: 100vh;
        min-height: 0;
        border-radius: 0;
        display: block
      }

      .sidebar {
        height: 100%
      }

      .chat {
        display: none;
        height: 100%
      }

      .shell.chat-open .sidebar {
        display: none
      }

      .shell.chat-open .chat {
        display: flex
      }

      .mobile-only {
        display: block
      }

      .chat-header {
        padding: 0 14px
      }

      .messages {
        padding: 24px 4%
      }

      .message {
        max-width: 84%
      }

      .composer-wrap {
        padding: 10px 10px 12px
      }

      .header-actions .icon-btn:nth-child(1) {
        display: none
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="shell" id="shell">
      <aside class="sidebar">
        <div class="brand">
          <h1>Wave<span>net</span></h1><button class="icon-btn" id="profileBtn" title="Profile"><i
              class="fa-solid fa-gear"></i></button>
        </div>
        <div class="profile-card">
          <div class="avatar" id="myAvatar">ME</div>
          <div><strong id="myName">Welcome</strong><small id="myAbout">Your private conversations</small></div><button
            class="icon-btn" id="logoutBtn" style="color:white;margin-left:auto" title="Log out"><i
              class="fa-solid fa-arrow-right-from-bracket"></i></button>
        </div>
        <label class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput"
            placeholder="Search conversations"></label>
        <div class="section-label">Recent chats</div>
        <div class="contacts" id="contacts"></div>
      </aside>
      <section class="chat">
        <header class="chat-header"><button class="icon-btn mobile-only" id="backBtn"><i
              class="fa-solid fa-arrow-left"></i></button>
          <div class="avatar" id="activeAvatar">?</div>
          <div class="chat-person"><strong id="activeName">Select a conversation</strong><small id="activeStatus">Your
              messages are private</small></div>
          <div class="header-actions"><button class="icon-btn" id="audioBtn" title="Audio call"><i
                class="fa-solid fa-phone"></i></button><button class="icon-btn" id="videoBtn" title="Video call"><i
                class="fa-solid fa-video"></i></button><button class="icon-btn" id="chatSearchBtn" title="Search"><i
                class="fa-solid fa-magnifying-glass"></i></button></div>
        </header>
        <div class="messages" id="messages">
          <div class="empty"><i class="fa-regular fa-comments"></i>
            <h2>Your conversations</h2>
            <p>Choose a person to start chatting securely.</p>
          </div>
        </div>
        <div class="typing" id="typing"></div>
        <div class="composer-wrap">
          <div class="emoji-panel" id="emojiPanel"></div>
          <div class="upload-preview" id="uploadPreview">
            <img id="uploadPreviewImage" alt="Selected image preview">
            <span>Image ready to send</span>
            <button type="button" id="removeUpload" title="Remove image"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <form class="composer" id="chatForm"><button type="button" class="icon-btn" id="emojiBtn" title="Emoji"><i
                class="fa-regular fa-face-smile"></i></button><label class="icon-btn" title="Attach image"><i
                class="fa-solid fa-paperclip"></i><input class="file-input" id="fileInput" type="file"
                accept="image/*"></label><input id="messageInput" autocomplete="off"
              placeholder="Write a message..."><button class="send" title="Send"><i
                class="fa-solid fa-paper-plane"></i></button></form>
        </div>
      </section>
    </section>
  </main>
  <div class="modal open" id="authModal">
    <div class="modal-card">
      <h2>Welcome to Wavenet</h2>
      <div class="auth-tabs"><button class="active" data-mode="login">Log in</button><button data-mode="register">Create
          account</button></div>
      <form id="authForm"><label class="field"><span>USER ID</span><input id="authId" required
            placeholder="e.g. vivek"></label><label class="field" id="nameField" style="display:none"><span>YOUR
            NAME</span><input id="authName" placeholder="Your display name"></label><label
          class="field"><span>PASSWORD</span><input id="authPassword" type="password" required minlength="4"
            placeholder="At least 4 characters"></label>
        <div class="auth-error" id="authError"></div><button class="primary" id="authSubmit">Continue</button>
      </form>
    </div>
  </div>
  <aside class="drawer" id="profileDrawer">
    <div class="drawer-head">
      <h2>My profile</h2><button class="icon-btn" id="closeDrawer"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="avatar big-avatar" id="drawerAvatar">ME</div>
    <form id="profileForm"><label class="field"><span>DISPLAY NAME</span><input id="profileName"></label><label
        class="field"><span>ABOUT</span><input id="profileAbout"></label><label class="field"><span>PROFILE
          PHOTO</span><input id="profileAvatar" type="file" accept="image/*"></label><button class="primary">Save
        profile</button></form>
  </aside>
  <div class="toast" id="toast"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    (() => {
      const socket = io(), $ = id => document.getElementById(id); let me = JSON.parse(localStorage.getItem('wavenet-user') || 'null'), active = null, draftImage = null;
      const emojis = ['😀', '😂', '😊', '😍', '🥳', '👍', '👏', '🙏', '❤️', '🔥', '✨', '🎉', '😅', '🤔', '😎', '🙌', '💚', '🌟', '✅', '👋', '😢'];
      $('emojiPanel').innerHTML = emojis.map(e => `<button type="button">${e}</button>`).join('');
      const avatar = (user, el) => { el.textContent = user?.name?.slice(0, 2).toUpperCase() || '?'; if (user?.avatar) el.style.background = `url(${user.avatar}) center/cover`; };
      const toast = (text) => { const el = $('toast'); el.textContent = text; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2200) };
      async function api(url, options = {}) { const response = await fetch(url, { headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }, ...options }); const body = await response.json(); if (!response.ok) throw Error(body.message || 'Something went wrong'); return body }
      function showAuth(mode = 'login') { $('nameField').style.display = mode === 'register' ? 'block' : 'none'; $('authSubmit').textContent = mode === 'register' ? 'Create account' : 'Continue'; document.querySelectorAll('.auth-tabs button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode)); $('authForm').dataset.mode = mode }
      document.querySelectorAll('.auth-tabs button').forEach(b => b.onclick = () => showAuth(b.dataset.mode));
      $('authForm').onsubmit = async e => { e.preventDefault(); $('authError').textContent = ''; const mode = e.currentTarget.dataset.mode || 'login'; try { const data = await api(`/api/chat/auth/${mode}`, { method: 'POST', body: JSON.stringify({ id: $('authId').value, name: $('authName').value, password: $('authPassword').value }) }); me = data.user; localStorage.setItem('wavenet-user', JSON.stringify(me)); $('authModal').classList.remove('open'); boot() } catch (err) { $('authError').textContent = err.message } };
      function renderMe() { avatar(me, $('myAvatar')); avatar(me, $('drawerAvatar')); $('myName').textContent = me.name; $('myAbout').textContent = me.about; $('profileName').value = me.name; $('profileAbout').value = me.about }
      async function loadUsers() { const data = await api(`/api/chat/users/${me.id}`); $('contacts').innerHTML = ''; data.users.forEach(user => { const item = document.createElement('button'); item.className = 'contact'; item.dataset.id = user.id; item.innerHTML = `<div class="avatar">${user.name.slice(0, 2).toUpperCase()}</div><div class="contact-info"><div class="contact-top"><strong>${escapeHtml(user.name)}</strong><time>${user.lastMessageAt ? new Date(user.lastMessageAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}</time></div><span class="preview">${escapeHtml(user.lastMessage || user.about || 'Start a conversation')}</span></div>`; avatar(user, item.querySelector('.avatar')); item.onclick = () => openChat(user); $('contacts').appendChild(item) }) }
      function openChat(user) { active = user; document.querySelectorAll('.contact').forEach(c => c.classList.toggle('active', c.dataset.id === user.id)); avatar(user, $('activeAvatar')); $('activeName').textContent = user.name; $('activeStatus').textContent = 'online now'; $('shell').classList.add('chat-open'); socket.emit('loadConversation', user.id); $('messageInput').focus() }
      function renderMessages(list) { $('messages').innerHTML = '<div class="date-chip">Today</div>'; list.forEach(renderMessage); $('messages').scrollTop = $('messages').scrollHeight }
      function renderMessage(msg) { const sent = msg.from === me.id, el = document.createElement('article'); el.className = `message ${sent ? 'sent' : 'received'} ${msg.type === 'deleted' ? 'deleted' : ''}`; el.dataset.id = msg.id; const time = msg.createdAt ? new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); let body = msg.type === 'deleted' ? 'This message was deleted' : msg.mediaUrl ? `<img src="${msg.mediaUrl}" alt="Shared image">${escapeHtml(msg.text || '')}` : escapeHtml(msg.text); el.innerHTML = `<p>${body}</p><span class="meta">${time}${msg.editedAt ? ' · edited' : ''}${sent ? '<i class="fa-solid fa-check-double"></i>' : ''}</span>${sent && msg.type !== 'deleted' ? `<div class="message-menu"><button data-action="edit">Edit</button><button data-action="delete">Delete for me</button><button data-action="everyone">Delete for everyone</button></div>` : ''}`; $('messages').appendChild(el) }
      socket.on('conversation_history', renderMessages); socket.on('message_saved', msg => { if (active && msg.to === active.id) { renderMessage(msg); $('messages').scrollTop = $('messages').scrollHeight } }); socket.on('message_received', msg => { if (active && msg.from === active.id) { renderMessage(msg); $('messages').scrollTop = $('messages').scrollHeight } else { loadUsers() } }); socket.on('message_updated', msg => { const old = document.querySelector(`[data-id="${msg.id}"]`); if (old) { old.remove(); renderMessage(msg) } }); socket.on('message_deleted', data => { const old = document.querySelector(`[data-id="${data.id}"]`); if (old) { old.querySelector('p').textContent = 'This message was deleted'; old.classList.add('deleted'); const menu = old.querySelector('.message-menu'); if (menu) menu.remove() } }); socket.on('typing', data => { if (active?.id === data.from) $('typing').textContent = data.isTyping ? 'typing...' : '' }); socket.on('incoming_call', data => toast(`${data.from} is calling (${data.kind})`));
      const clearUploadPreview = () => { draftImage = null; $('uploadPreview').classList.remove('open'); $('uploadPreviewImage').removeAttribute('src'); $('fileInput').value = '' };
      $('chatForm').onsubmit = e => { e.preventDefault(); const text = $('messageInput').value.trim(); if (!active || (!text && !draftImage)) return; socket.emit('message', { to: active.id, text, type: draftImage ? 'image' : 'text', mediaUrl: draftImage }); $('messageInput').value = ''; clearUploadPreview() }; $('messageInput').oninput = () => { if (active) socket.emit('typing', { to: active.id, isTyping: Boolean($('messageInput').value) }) }; $('emojiBtn').onclick = () => $('emojiPanel').classList.toggle('open'); document.querySelectorAll('#emojiPanel button').forEach(b => b.onclick = () => { $('messageInput').value += b.textContent; $('emojiPanel').classList.remove('open'); $('messageInput').focus() }); $('fileInput').onchange = e => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = () => { draftImage = reader.result; $('uploadPreviewImage').src = draftImage; $('uploadPreview').classList.add('open'); $('messageInput').focus() }; reader.readAsDataURL(file) }; $('removeUpload').onclick = clearUploadPreview;
      $('messages').onclick = e => { const btn = e.target.closest('[data-action]'); if (!btn) return; const msg = btn.closest('.message'); const action = btn.dataset.action; if (action === 'edit') { const text = prompt('Edit message', msg.querySelector('p').textContent); if (text?.trim()) socket.emit('edit_message', { id: msg.dataset.id, text, to: active.id }) } else socket.emit('delete_message', { id: msg.dataset.id, to: active.id, everyone: action === 'everyone' }) }; $('audioBtn').onclick = () => active && socket.emit('call', { to: active.id, kind: 'audio' }); $('videoBtn').onclick = () => active && socket.emit('call', { to: active.id, kind: 'video' }); $('backBtn').onclick = () => $('shell').classList.remove('chat-open'); $('searchInput').oninput = e => document.querySelectorAll('.contact').forEach(c => c.style.display = c.textContent.toLowerCase().includes(e.target.value.toLowerCase()) ? 'flex' : 'none');
      $('profileBtn').onclick = () => $('profileDrawer').classList.add('open'); $('closeDrawer').onclick = () => $('profileDrawer').classList.remove('open'); $('profileAvatar').onchange = e => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = () => { draftImage = reader.result }; reader.readAsDataURL(file) }; $('profileForm').onsubmit = async e => { e.preventDefault(); try { const data = await api(`/api/chat/profile/${me.id}`, { method: 'PATCH', body: JSON.stringify({ name: $('profileName').value, about: $('profileAbout').value, avatar: draftImage }) }); me = data.user; draftImage = null; localStorage.setItem('wavenet-user', JSON.stringify(me)); renderMe(); $('profileDrawer').classList.remove('open'); toast('Profile updated') } catch (err) { toast(err.message) } }; $('logoutBtn').onclick = () => { localStorage.removeItem('wavenet-user'); location.reload() };
      function escapeHtml(value) { const el = document.createElement('span'); el.textContent = value || ''; return el.innerHTML } async function boot() { renderMe(); socket.emit('join', me.id); await loadUsers() } if (me) { $('authModal').classList.remove('open'); boot() }
    })();
  </script>
</body>
